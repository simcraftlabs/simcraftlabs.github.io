<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Атлас України · 9 клас · господарство</title>
<style>
:root{--bg:#0a1222;--panel:#111d2e;--border:#1e3a50;--accent:#4fc3f7;--accent2:#ffd54f;--muted:#546e7a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#e0e0e0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-shrink:0;flex-wrap:wrap}
header h1{font-size:1.05em;color:var(--accent2)}
header .sub{font-size:.78em;color:var(--muted)}
.tools{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:.85em}
.tools label{display:flex;align-items:center;gap:5px;cursor:pointer;color:#90caf9;user-select:none}
.mw{flex:1;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#tip{position:absolute;pointer-events:none;background:rgba(17,29,46,.97);color:#fff;padding:7px 12px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid var(--accent2);display:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.5);z-index:10}
#tip small{display:block;font-weight:400;font-size:12px;color:#90a4ae;margin-top:2px}
#legend{position:absolute;bottom:10px;left:10px;background:rgba(17,29,46,.92);padding:10px 12px;border-radius:8px;font-size:11px;border:1px solid var(--border)}
#legend h4{font-size:11px;color:var(--accent2);margin-bottom:6px;font-weight:600}
#legend .bar{display:flex;height:14px;width:200px;border-radius:3px;overflow:hidden;margin-bottom:3px}
#legend .ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:9px}
.ctrls{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px}
.ctrls button{width:32px;height:32px;border:1px solid var(--border);background:rgba(17,29,46,.9);color:#90caf9;border-radius:6px;font-size:16px;cursor:pointer}
.ctrls button:hover{background:var(--border)}

header{gap:10px}
.hbtn{background:rgba(17,29,46,.9);border:1px solid var(--border);color:#90caf9;border-radius:6px;padding:6px 11px;cursor:pointer;font-size:.85em;flex-shrink:0}
.hbtn:hover{background:var(--border);color:#fff}
.hbtns{display:flex;gap:6px;flex-shrink:0}
.hbtn.on{background:#3a2f10;border-color:#7a5a1a;color:var(--accent2)}
body.big #status{font-size:18px;line-height:26px;height:26px}
body.big #note{font-size:15px}
body.big #note:not(.collapsed){font-size:17px}
body.big #chips .chip{font-size:14px}
body.big #thleg{font-size:14px}
body.big #thleg h4{font-size:13px}
body.big .presets button{font-size:.9em}
body.big #panel{font-size:15px;width:300px}
.presets{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.presets button{font-size:.78em;padding:5px 10px;border-radius:14px;border:1px solid var(--border);background:transparent;color:#b0bec5;cursor:pointer}
.presets button:hover{background:var(--border);color:#fff}
#panel{position:absolute;top:0;left:0;bottom:0;width:264px;background:rgba(10,19,32,.97);border-right:1px solid var(--border);padding:14px 16px 24px;overflow-y:auto;transform:translateX(-106%);transition:transform .18s ease;z-index:20;font-size:13px}
#panel.open{transform:none}
#panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent2);margin:16px 0 4px;font-weight:600}
#panel h3:first-child{margin-top:0}
#panel .hint{color:var(--muted);font-size:11px;margin:0 0 7px}
#panel .grp{color:var(--muted);font-size:11px;margin:9px 0 3px}
#panel label{display:flex;align-items:center;gap:7px;padding:3px 0;color:#cfd8dc;cursor:pointer}
#panel label:hover{color:#fff}
#panel .key{margin-left:auto;color:var(--muted);font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 5px}
#panel .pfoot{margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
#panel .keys{color:var(--muted);font-size:11px;line-height:1.5;margin-top:8px}
#panel .pfoot button{width:100%;margin-bottom:6px;padding:7px;border-radius:6px;border:1px solid var(--border);background:transparent;color:#90caf9;cursor:pointer;font-size:.9em}
#panel .pfoot button:hover{background:var(--border);color:#fff}
#thleg{position:absolute;bottom:10px;left:10px;background:rgba(17,29,46,.94);padding:10px 12px;border-radius:8px;font-size:12px;border:1px solid var(--border);max-width:262px;display:none}
#thleg h4{font-size:11px;color:var(--accent2);margin-bottom:7px;font-weight:600}
#thleg .row{display:flex;align-items:center;gap:8px;margin:4px 0}
#thleg .sw{width:18px;height:12px;border-radius:2px;flex:0 0 auto;border:1px solid rgba(255,255,255,.25)}
#thleg .pc{margin-left:auto;color:var(--muted);font-size:11px;padding-left:8px}
#bottom{flex-shrink:0;background:var(--panel);border-top:1px solid var(--border);padding:5px 12px 6px;position:relative}
body.barhid #bottom{padding:0 12px;height:0;overflow:hidden;border-top:none}
#row2{display:flex;align-items:center;gap:12px;min-height:22px}
#row2 #chips{flex:0 1 auto;min-width:0;overflow:hidden}
#barBtn{position:absolute;right:8px;top:2px;background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:13px;line-height:1;padding:2px 5px}
#barBtn:hover{color:#fff}
body.barhid #barBtn{position:fixed;right:10px;bottom:2px;z-index:30;background:rgba(17,29,46,.9);border-radius:5px}
/* Довідка: згорнута — рядок праворуч від чіпів; розгорнута — накладка над картою */
#note{flex:1;min-width:0;font-size:13.5px;line-height:22px;margin:0}
#note.collapsed{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
#note.collapsed .line{display:inline}
#note:not(.collapsed){position:absolute;left:12px;right:12px;bottom:100%;margin-bottom:6px;
  background:rgba(13,27,46,.97);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;box-shadow:0 -6px 24px rgba(0,0,0,.45);z-index:25;
  max-height:46vh;overflow-y:auto;font-size:15px;line-height:1.5;text-align:left;white-space:normal}
#note .more{margin-top:6px;display:flex;flex-direction:column;gap:4px}
#status{font-size:15px;line-height:22px;height:22px;color:#e3edf3;margin-bottom:3px;cursor:default;display:flex;align-items:center;gap:12px;overflow:hidden}
#statusText{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbtn{flex-shrink:0;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:12px;padding:2px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.sbtn:hover{background:var(--border);color:#fff}
.sbtn.off{border-color:#7a5a1a;color:var(--accent2)}
#status b{color:#fff;font-weight:600}
#status .k{color:var(--muted);font-size:13px}
#status .sep{color:#39516a;padding:0 4px}
#status .on{color:var(--accent2)}
#status .co{color:var(--muted);font-size:13px}
#status .hint{color:var(--muted);font-size:13px}
#status.pin{border-left:3px solid var(--accent2);padding-left:8px}
#chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:22px}
#chips .empty{color:var(--muted);font-size:12px}
#chips .chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:13px;padding:2px 6px 2px 10px;color:#90caf9;font-size:12px;cursor:pointer}
#chips .chip:hover{background:var(--border);color:#fff}
#chips .chip.theme{background:#16324a;color:var(--accent2);border-color:#2a4d6b}
#chips .chip .x{color:var(--muted);padding:0 3px;font-size:14px;line-height:1}
#chips .chip .x:hover{color:#ff8a80}
#note{color:#cfd8dc}
#note .line{cursor:pointer}
#note b{color:var(--accent2);font-weight:600}
#note .tgl{color:var(--muted);font-size:12px;white-space:nowrap}
#note.collapsed .tgl{float:right;margin-left:10px}
#note:not(.collapsed) .tgl{float:right;cursor:pointer}
#note .more{margin-top:6px;display:flex;flex-direction:column;gap:4px}
#note.collapsed .more{display:none}
#note .acc{color:#a5d6a7}
#note .warn{color:#ffab91}
#note .src{color:var(--muted);font-size:12.5px}
#note .attrib{padding-top:4px;font-size:11.5px}
</style></head>

function px(lon){return (mapOx+(lon-LON0)/(LON1-LON0)*mapW)*scale+panX;}
function py(lat){return (mapOy+mapH-(mercY(lat)-MY0)/latRange*mapH)*scale+panY;}

// Hypsometric ramp
function drawDensityFill(){
  ctx.save();ctx.globalAlpha=0.82;
  UA.features.forEach(f=>{const r=DENSITY.regions[f.properties.uk];if(!r)return;ctx.fillStyle=r.fill;traceFeature(f);ctx.fill('evenodd');});
  ctx.restore();
  ctx.strokeStyle='rgba(70,55,40,0.55)';ctx.lineWidth=0.9;
  UA.features.forEach(f=>{if(!DENSITY.regions[f.properties.uk])return;traceFeature(f);ctx.stroke();});
}

function drawDensityLabels(){
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.font='bold 12px system-ui';
  Object.values(DENSITY.regions).forEach(r=>{
    const x=px(r.xy[0]),y=py(r.xy[1]); if(x<0||x>W||y<0||y>H)return;
    placeAreaLabel(labelBoxes,x,y,String(r.d),'#222','rgba(255,255,255,0.9)');
  });
  const kx=px(DENSITY.kyiv.xy[0]),ky=py(DENSITY.kyiv.xy[1]);
  ctx.beginPath();ctx.arc(kx,ky,4,0,6.2832);ctx.fillStyle='#7a0018';ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.textAlign='center';ctx.font='bold 11px system-ui';
  placePointLabel(labelBoxes,kx,ky,5,showCities?DENSITY.kyiv.t.replace('Київ ',''):DENSITY.kyiv.t,'#7a0018');
}

const PWR_TYPES=[
  {k:'АЕС',c:'#e53935'},{k:'ТЕС',c:'#6d4c41'},{k:'ТЕЦ',c:'#fb8c00'},
  {k:'ГЕС',c:'#1e88e5'},{k:'ГАЕС',c:'#00acc1'},{k:'ВЕС',c:'#43a047'},{k:'СЕС',c:'#fbc02d'}
];
const PWR_C={};PWR_TYPES.forEach(t=>PWR_C[t.k]=t.c);
const PWR_VMAX=6000, PWR_RMIN=4.5, PWR_RMAX=22;
function powerRadius(mw){return PWR_RMIN+(PWR_RMAX-PWR_RMIN)*Math.sqrt(Math.max(0,mw)/PWR_VMAX);}

function powerGlyph(x,y,r,type,state){
  const col=PWR_C[type]||'#777'; const TAU=6.28318; ctx.lineJoin='round';
  if(state==='dest'){
    // ЗРУЙНОВАНА / НЕ ПРАЦЮЄ — порожній світлий кружок + червоний ✕
    ctx.beginPath();ctx.arc(x,y,r,0,TAU);
    ctx.fillStyle='#f3ece8';ctx.fill();
    ctx.lineWidth=1.3;ctx.strokeStyle='#a84a3c';ctx.stroke();
    const d=r*0.6;ctx.strokeStyle='#c62828';ctx.lineWidth=Math.max(1.6,r*0.3);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x-d,y-d);ctx.lineTo(x+d,y+d);ctx.moveTo(x+d,y-d);ctx.lineTo(x-d,y+d);ctx.stroke();
    ctx.lineCap='butt';
  }else if(state==='occ'){
    // ОКУПОВАНА — колір типу + коса штриховка (читається з першого погляду)
    ctx.save();
    ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.clip();
    ctx.fillStyle=col;ctx.globalAlpha=0.9;ctx.fillRect(x-r,y-r,2*r,2*r);ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(15,18,24,0.9)';ctx.lineWidth=1.3;
    for(let o=-2*r;o<=2*r;o+=4.5){ctx.beginPath();ctx.moveTo(x-r+o,y-r);ctx.lineTo(x+r+o,y+r);ctx.stroke();}
    ctx.restore();
    ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.lineWidth=1.5;ctx.strokeStyle='#111';ctx.stroke();
  }else{
    // ДІЮЧА — суцільний кружок
    ctx.beginPath();ctx.arc(x,y,r,0,TAU);
    ctx.fillStyle=col;ctx.globalAlpha=0.9;ctx.fill();ctx.globalAlpha=1;
    ctx.lineWidth=1.4;ctx.strokeStyle='#fff';ctx.stroke();
    ctx.lineWidth=0.9;ctx.strokeStyle='rgba(20,30,45,0.5)';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();
  }
}

function drawPowerPlants(){
  PLANTS.slice().sort((a,b)=>b.mw-a.mw).forEach(p=>{
    const x=px(p.xy[0]),y=py(p.xy[1]); if(x<-40||x>W+40||y<-40||y>H+40)return;
    const r=powerRadius(p.mw);
    powerGlyph(x,y,r,p.type,p.state);
    symbolBoxes.push([x-r-3,y-r-3,2*r+6,2*r+6]);
  });
}

function drawPowerLabels(){
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  PLANTS.slice().sort((a,b)=>b.mw-a.mw).forEach(p=>{
    const x=px(p.xy[0]),y=py(p.xy[1]); if(x<0||x>W||y<0||y>H)return;
    if(p.mw<800 && scale<1.7) return;
    const r=powerRadius(p.mw);
    ctx.font='bold 11px system-ui';
    const col=(p.state==='dest')?'#8a1c1c':'#12233a';
    placePointLabel(labelBoxes,x,y,r+2,p.n,col);
  });
}

function drawPowerLegend(measure){
  const pad=9, bw=200, halfN=Math.ceil(PWR_TYPES.length/2);
  const circH=84, typeH=halfN*17+20, stateH=3*15+18, bh=circH+typeH+stateH+pad;
  const bx=12, by=H-bh-46;
  if(!measure) plate(bx,by,bw,bh,10);
  if(!measure){
    // nested circles
    ctx.textAlign='left';ctx.fillStyle='#12233a';ctx.font='bold 11px system-ui';
    ctx.fillText('Потужність, МВт',bx+pad,by+15);
    const baseY=by+circH-6, cxC=bx+42;
    [6000,2000,500].forEach(v=>{
      const rr=powerRadius(v);
      ctx.beginPath();ctx.arc(cxC,baseY-rr,rr,0,6.2832);
      ctx.strokeStyle='#6b7b8c';ctx.lineWidth=1.1;ctx.setLineDash([2,2]);ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(cxC,baseY-2*rr);ctx.lineTo(cxC+40,baseY-2*rr);
      ctx.strokeStyle='#9aa7b4';ctx.lineWidth=0.7;ctx.stroke();
      ctx.textAlign='left';ctx.font='10px system-ui';ctx.fillStyle='#33414f';ctx.textBaseline='middle';
      ctx.fillText(String(v),cxC+44,baseY-2*rr);
    });
    // type colours
    const ty=by+circH+2;
    ctx.font='bold 11px system-ui';ctx.fillStyle='#12233a';ctx.textAlign='left';ctx.textBaseline='alphabetic';
    ctx.fillText('Тип станції',bx+pad,ty+12);
    PWR_TYPES.forEach((t,i)=>{
      const c=Math.floor(i/halfN), row=i%halfN, lx=bx+pad+c*96, ly=ty+26+row*17;
      ctx.beginPath();ctx.arc(lx+5,ly,5,0,6.2832);ctx.fillStyle=t.c;ctx.globalAlpha=0.82;ctx.fill();ctx.globalAlpha=1;
      ctx.lineWidth=1;ctx.strokeStyle='#fff';ctx.stroke();
      ctx.fillStyle='#33414f';ctx.font='10px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(t.k,lx+14,ly);
    });
    // states
    const sy=ty+typeH+2;
    ctx.font='bold 11px system-ui';ctx.fillStyle='#12233a';ctx.textBaseline='alphabetic';ctx.fillText('Стан (з 2022)',bx+pad,sy+12);
    [['work','діюча'],['occ','на окупованій території'],['dest','зруйнована / не працює']].forEach((it,i)=>{
      const ly=sy+26+i*15, lx=bx+pad+6;
      powerGlyph(lx,ly,5,'ТЕС',it[0]);
      ctx.fillStyle='#33414f';ctx.font='10px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(it[1],lx+16,ly);
    });
  }
  return [bx,by,bw,bh];
}

function drawTransportLines(){
  ctx.lineJoin='round';ctx.lineCap='round';
  // під картограмою потрібна світла підкладка для контрасту; на чистій карті —
  // одна суцільна темна лінія (підкладка кольору тла робила її блідою/рваною).
  if(activeTheme() && !blankMode){
    ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=3.4;
    RAIL.forEach(seg=>{ctx.beginPath();seg.forEach((p,i)=>{const x=px(p[0]),y=py(p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();});
  }
  ctx.strokeStyle='#166a5d';ctx.lineWidth=1.7;
  RAIL.forEach(seg=>{ctx.beginPath();seg.forEach((p,i)=>{const x=px(p[0]),y=py(p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();});
  ctx.lineCap='butt';
}
function transBadge(x,y,r,ring){
  ctx.beginPath();ctx.arc(x,y,r,0,6.2832);
  ctx.fillStyle='rgba(255,255,255,0.92)';ctx.fill();
  ctx.lineWidth=1.6;ctx.strokeStyle=ring;ctx.stroke();
}
function anchorGlyph(x,y,s,col){
  ctx.strokeStyle=col;ctx.lineWidth=Math.max(1.4,s*0.30);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.arc(x,y-s*0.72,s*0.30,0,6.2832);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y-s*0.5);ctx.lineTo(x,y+s*0.82);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-s*0.62,y+s*0.02);ctx.lineTo(x+s*0.62,y+s*0.02);ctx.stroke();
  ctx.beginPath();ctx.arc(x,y+s*0.16,s*0.80,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  ctx.lineCap='butt';
}
function planeGlyph(x,y,s,col){
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(x,y-s);ctx.lineTo(x+s*0.16,y+s*0.12);ctx.lineTo(x+s,y+s*0.46);ctx.lineTo(x+s,y+s*0.70);
  ctx.lineTo(x+s*0.16,y+s*0.46);ctx.lineTo(x+s*0.26,y+s);ctx.lineTo(x-s*0.26,y+s);ctx.lineTo(x-s*0.16,y+s*0.46);
  ctx.lineTo(x-s,y+s*0.70);ctx.lineTo(x-s,y+s*0.46);ctx.lineTo(x-s*0.16,y+s*0.12);ctx.closePath();ctx.fill();
}

function transReserve(){

function drawTransportSymbols(){
  PORTS.forEach(p=>{const x=px(p.xy[0]),y=py(p.xy[1]);const col=p.st==='occ'?OCC_COL:PORT_COL;

  });

const METAL_C={'ч':'#546e7a','к':'#c17817'};
const METAL_VMAX=9, METAL_RMIN=5, METAL_RMAX=24, METAL_RCOL=8;
function metalRadius(v){return METAL_RMIN+(METAL_RMAX-METAL_RMIN)*Math.sqrt(Math.max(0,v)/METAL_VMAX);}
// узагальнений кружок стану (та сама логіка, що й для електростанцій): суцільний / штрихований / ✕
function stateCircle(x,y,r,col,state){
  const T=6.28318;ctx.lineJoin='round';
  if(state==='dest'){
    ctx.beginPath();ctx.arc(x,y,r,0,T);ctx.fillStyle='#efe7e2';ctx.globalAlpha=0.92;ctx.fill();ctx.globalAlpha=1;
    ctx.setLineDash([3,2.2]);ctx.lineWidth=1.6;ctx.strokeStyle=col;ctx.stroke();ctx.setLineDash([]);
    const d=r*0.6;ctx.strokeStyle='#c62828';ctx.lineWidth=Math.max(1.6,r*0.3);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x-d,y-d);ctx.lineTo(x+d,y+d);ctx.moveTo(x+d,y-d);ctx.lineTo(x-d,y+d);ctx.stroke();ctx.lineCap='butt';
  }else if(state==='occ'){
    ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,T);ctx.clip();
    ctx.fillStyle=col;ctx.globalAlpha=0.9;ctx.fillRect(x-r,y-r,2*r,2*r);ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(15,18,24,0.9)';ctx.lineWidth=1.3;
    for(let o=-2*r;o<=2*r;o+=4.5){ctx.beginPath();ctx.moveTo(x-r+o,y-r);ctx.lineTo(x+r+o,y+r);ctx.stroke();}
    ctx.restore();ctx.beginPath();ctx.arc(x,y,r,0,T);ctx.lineWidth=1.5;ctx.strokeStyle='#111';ctx.stroke();
  }else{
    ctx.beginPath();ctx.arc(x,y,r,0,T);ctx.fillStyle=col;ctx.globalAlpha=0.9;ctx.fill();ctx.globalAlpha=1;
    ctx.lineWidth=1.4;ctx.strokeStyle='#fff';ctx.stroke();
    ctx.lineWidth=0.9;ctx.strokeStyle='rgba(20,30,45,0.5)';ctx.beginPath();ctx.arc(x,y,r,0,T);ctx.stroke();
  }
}
function metalR(p){return p.b==='ч'?metalRadius(p.cap):METAL_RCOL;}
function drawMetal(){

    const x=px(p.xy[0]),y=py(p.xy[1]); if(x<-40||x>W+40||y<-40||y>H+40)return;

}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=blankMode?'#dcebf5':'#a9cfe8';ctx.fillRect(0,0,W,H);
  if(blankMode){
    // контурна карта: суходіл білий, сусіди світло-сірі
    ctx.fillStyle='#dfe3e0';
    NEIGH.countries.forEach(c=>{c.polys.forEach(poly=>{traceRings(poly);ctx.fill('evenodd');});});
    ctx.strokeStyle='rgba(90,110,120,0.5)';ctx.lineWidth=0.8;
    NEIGH.countries.forEach(c=>{c.polys.forEach(poly=>{traceRings(poly);ctx.stroke();});});
    ctx.fillStyle='#ffffff';
    UA.features.forEach(f=>{traceFeature(f);ctx.fill('evenodd');});
  }else{
    drawNeighbourLand();
    // тихе світле тло суходолу — на ньому працюватимуть господарські значки
    ctx.fillStyle='#e8e0cf';
    UA.features.forEach(f=>{traceFeature(f);ctx.fill('evenodd');});
  }
  if(showDensity && !showUrban) drawDensityFill();
  if(showUrban) drawUrbanFill();
  if(showForest) drawForestFill();
  if(showGDP) drawGDPFill();
  if(showAgroZones) drawAgroZonesFill();
  if(showFuel||showOre) drawMineralAreas();
  if(showWater) drawWaterFill();
  // межі областей
  if(showBorders){
    ctx.strokeStyle='rgba(10,18,34,0.5)';ctx.lineWidth=0.7;
    UA.features.forEach(f=>{const ps=f.geometry.type==='MultiPolygon'?f.geometry.coordinates:[f.geometry.coordinates];ctx.beginPath();ps.forEach(poly=>poly.forEach(r=>{r.forEach((p,j)=>{const x=px(p[0]),y=py(p[1]);j===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.closePath()}));ctx.stroke();});
    ctx.strokeStyle='#0a1222';ctx.lineWidth=1.6;
    UA.features.forEach(f=>{const ps=f.geometry.type==='MultiPolygon'?f.geometry.coordinates:[f.geometry.coordinates];ctx.beginPath();ps.forEach(poly=>poly.forEach(r=>{r.forEach((p,j)=>{const x=px(p[0]),y=py(p[1]);j===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.closePath()}));ctx.stroke();});
  }
  if(showRivers) drawRivers();
  if(showTransport) drawTransportLines();
  // ── фаза значків: усе, що має тіло на карті, малюється ДО підписів
  symbolBoxes.length=0;

    ctx.font=(o.firstBig?'bold 14px':o.nameFont)+' system-ui';

    const bh=lines.length*o.lh+(s.pct?o.pctDy:0)+6;

    const off=[[0,0],[0,-26],[0,26],[-wmax/2-16,0],[wmax/2+16,0],[0,-48],[0,48],
               [-wmax/2-16,-30],[wmax/2+16,-30],[-wmax/2-16,30],[wmax/2+16,30],[0,-70],[0,70]];

      put=[xx,yy0,tb];break;
    }
    if(!put)return;
    labelBoxes.push(put[2]);
    const cx=put[0], y0=put[1];
    lines.forEach((ln,i)=>{
      ctx.font=(i===0?(o.firstBig?'bold 14px':o.nameFont):'12px')+' system-ui';
      const yy=y0+i*o.lh;
      ctx.strokeStyle=halo;ctx.lineWidth=4;ctx.strokeText(ln,cx,yy);

      ctx.fillStyle=s.text;ctx.fillText(s.pct,cx,yy);

}

  ctx.beginPath();

  ctx.closePath();
  ctx.fillStyle=UNESCO_C;ctx.globalAlpha=0.95;ctx.fill();ctx.globalAlpha=1;
  ctx.lineWidth=1.4;ctx.strokeStyle='#fff';ctx.stroke();
  if(state==='occ'){
    ctx.save();ctx.clip();ctx.strokeStyle='rgba(15,18,24,0.9)';ctx.lineWidth=1.2;
    for(let o=-2*r;o<=2*r;o+=4.5){ctx.beginPath();ctx.moveTo(x-r+o,y-r);ctx.lineTo(x+r+o,y+r);ctx.stroke();}
    ctx.restore();

}

function mineralLayers(){const a=[];if(showFuel)a.push(MINERALS.fuel);if(showOre)a.push(MINERALS.ore);if(showNon)a.push(MINERALS.non);return a;}
function drawMineralAreas(){
  const zs=[];

  if(zs.length) washFill(zs,mineralCanvas);
}
function mineralGlyph(g,x,y,r){
  const d=MG[g]; if(!d)return;
  const sh=d.s;
  ctx.beginPath();
  if(sh==='sq'||sh==='sqd'){ctx.rect(x-r,y-r,2*r,2*r);}
  else if(sh==='bar'){ctx.rect(x-r*1.35,y-r*0.7,r*2.7,r*1.4);}
  else if(sh==='tri'){ctx.moveTo(x,y-r*1.25);ctx.lineTo(x+r*1.15,y+r*0.85);ctx.lineTo(x-r*1.15,y+r*0.85);ctx.closePath();}
  else if(sh==='dia'){ctx.moveTo(x,y-r*1.3);ctx.lineTo(x+r*1.08,y);ctx.lineTo(x,y+r*1.3);ctx.lineTo(x-r*1.08,y);ctx.closePath();}
  else if(sh==='hex'){for(let i=0;i<6;i++){const t=Math.PI/6+i*Math.PI/3,qx=x+r*1.15*Math.cos(t),qy=y+r*1.15*Math.sin(t);i?ctx.lineTo(qx,qy):ctx.moveTo(qx,qy);}ctx.closePath();}
  else if(sh==='star'){for(let i=0;i<10;i++){const rr=(i%2)?r*0.56:r*1.42,t=-Math.PI/2+i*Math.PI/5,qx=x+rr*Math.cos(t),qy=y+rr*Math.sin(t);i?ctx.lineTo(qx,qy):ctx.moveTo(qx,qy);}ctx.closePath();}
  else {ctx.arc(x,y,r*1.05,0,Math.PI*2);}
  ctx.fillStyle=d.c;ctx.fill();
  ctx.lineWidth=d.b?1.3:1.1;ctx.strokeStyle=d.b||'rgba(255,255,255,0.92)';ctx.stroke();
  if(sh==='sqd'){ctx.beginPath();ctx.moveTo(x-r,y+r);ctx.lineTo(x+r,y-r);ctx.moveTo(x-r,y);ctx.lineTo(x,y-r);ctx.moveTo(x,y+r);ctx.lineTo(x+r,y);ctx.strokeStyle='#2f2716';ctx.lineWidth=1;ctx.stroke();}
  if(d.d){ctx.beginPath();ctx.arc(x,y,Math.max(1.3,r*0.34),0,Math.PI*2);ctx.fillStyle=d.dc||'#ffffff';ctx.fill();}
}
function drawMinerals(){
  const drawn=labelBoxes, R=5.4;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  mineralLayers().forEach(L=>{L.areas.forEach(a=>{
    const x=px(a.label[0]),y=py(a.label[1]);
    if(x<-140||x>W+140||y<-90||y>H+90)return;
    ctx.font='bold 11.5px system-ui';
    const halo=haloFor(a.text), n=a.lines.length, lh=13, y0=y-(n-1)*lh/2;
    let wmax=0; a.lines.forEach(t=>{wmax=Math.max(wmax,ctx.measureText(t).width);});
    const ab=[x-wmax/2-3,y0-lh/2-3,wmax+6,n*lh+6];
    if(drawn.some(b=>ab[0]<b[0]+b[2]&&ab[0]+ab[2]>b[0]&&ab[1]<b[1]+b[3]&&ab[1]+ab[3]>b[1]))return;
    drawn.push(ab);
    a.lines.forEach((t,i)=>{
      ctx.strokeStyle=halo;ctx.lineWidth=4;ctx.strokeText(t,x,y0+i*lh);
      ctx.fillStyle=a.text;ctx.fillText(t,x,y0+i*lh);
    });
  });});
  mineralLayers().forEach(L=>{L.pts.forEach(p=>{
    const x=px(p.xy[0]),y=py(p.xy[1]);
    if(x<-40||x>W+40||y<-40||y>H+40)return;
    mineralGlyph(p.g,x,y,R);
  });});
  ctx.font='10px system-ui';
  mineralLayers().forEach(L=>{L.pts.forEach(p=>{
    if(!p.b && scale<1.0)return;
    const x=px(p.xy[0]),y=py(p.xy[1]);
    if(x<-40||x>W+40||y<-40||y>H+40)return;
    placePointLabel(drawn,x,y,R,p.n+(p.o?' *':''),'#2b1a08');
  });});
}
function mineralLegendBlocks(){
  return mineralLayers().map(L=>({t:L.t,leg:L.leg}));
}
function drawMineralsLegend(measure){
  const Ls=mineralLegendBlocks(); if(!Ls.length)return;
  ctx.save();ctx.textAlign='left';ctx.textBaseline='middle';
  const k=fontScale; let bx=10, by=10, rowH=0, bottom=10;
  Ls.forEach(L=>{
    ctx.font='10.5px system-ui';
    let tw=0; L.leg.forEach(e=>{tw=Math.max(tw,ctx.measureText(e.t).width);});
    ctx.font='bold 11px system-ui';
    tw=Math.max(tw,ctx.measureText(L.t).width-22*k);
    const bw=Math.max(Math.round(120*k),Math.round(tw+46*k));
    const bh=Math.round((30+L.leg.length*19)*k);
    if(bx+bw>W-10 && bx>10){bx=10;by+=rowH+8;rowH=0;}
    if(measure){labelBoxes.push([bx-4,by-4,bw+8,bh+8]);}
    else{
    ctx.fillStyle='rgba(255,255,255,0.93)';
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(bx,by,bw,bh,8);else ctx.rect(bx,by,bw,bh);
    ctx.fill();
    ctx.fillStyle='#222';ctx.font='bold 11px system-ui';ctx.fillText(L.t,bx+10*k,by+15*k);
    L.leg.forEach((e,i)=>{
      const cy=by+(34+i*19)*k;
      mineralGlyph(e.g,bx+18*k,cy,5*k);
      ctx.fillStyle='#222';ctx.font='10.5px system-ui';ctx.fillText(e.t,bx+32*k,cy);
    });
    }
    rowH=Math.max(rowH,bh); bottom=Math.max(bottom,by+bh); bx+=bw+8;
  });
  const ft='* тимчасово окуповані та прифронтові території · дані довоєнні';
  ctx.font='10px system-ui';
  const fw=ctx.measureText(ft).width+16;
  if(measure){labelBoxes.push([6,bottom+2,fw+8,26*k]);ctx.restore();return;}
  ctx.fillStyle='rgba(255,255,255,0.93)';
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(10,bottom+6,fw,20*k,6);else ctx.rect(10,bottom+6,fw,20*k);
  ctx.fill();
  ctx.fillStyle='#7a2a2a';ctx.fillText(ft,18,bottom+16*k);
  ctx.restore();
}


function washFill(zones,cnv){
  const dpr=devicePixelRatio||1; cnv.width=cv.width; cnv.height=cv.height;
  const c=cnv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
  zones.forEach(s=>{ c.fillStyle=s.fill;
    s.polys.forEach(poly=>{c.beginPath();poly.forEach(ring=>{ring.forEach((p,j)=>{const x=px(p[0]),y=py(p[1]);j===0?c.moveTo(x,y):c.lineTo(x,y);});c.closePath();});c.fill('evenodd');}); });
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.filter='blur('+(5*dpr)+'px)';ctx.drawImage(cnv,0,0);ctx.filter='none';ctx.restore();
}

function traceRings(poly){ctx.beginPath();poly.forEach(ring=>{ring.forEach((p,j)=>{const x=px(p[0]),y=py(p[1]);j===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.closePath();});}
function drawWaterFill(){
  ctx.fillStyle='rgba(92,166,216,0.78)'; ctx.strokeStyle='rgba(33,84,143,0.9)'; ctx.lineWidth=0.8;
  WATER.bodies.forEach(poly=>{traceRings(poly);ctx.fill('evenodd');ctx.stroke();});
  ctx.save();
  ctx.fillStyle='rgba(150,175,138,0.30)';
  WATER.former.forEach(poly=>{traceRings(poly);ctx.fill('evenodd');});
  ctx.setLineDash([6,4]); ctx.strokeStyle='rgba(88,120,78,0.85)'; ctx.lineWidth=1.2;
  WATER.former.forEach(poly=>{poly.forEach(ring=>{ctx.beginPath();ring.forEach((p,j)=>{const x=px(p[0]),y=py(p[1]);j===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.closePath();ctx.stroke();});});
  ctx.restore();
}
function drawWaterLabels(){
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.font='italic 11px system-ui';
  WATER.labels.forEach(l=>{const x=px(l.xy[0]),y=py(l.xy[1]); if(x<-70||x>W+70||y<-70||y>H+70)return;
    const w=ctx.measureText(l.t).width, b0=[x-w/2-2,y-8,w+4,16];
    if(labelBoxes.some(b=>b0[0]<b[0]+b[2]&&b0[0]+b0[2]>b[0]&&b0[1]<b[1]+b[3]&&b0[1]+b0[3]>b[1]))return;
    labelBoxes.push(b0);
    ctx.strokeStyle='rgba(255,255,255,0.92)';ctx.lineWidth=3;ctx.strokeText(l.t,x,y);
    ctx.fillStyle=(l.k==='f'?'#455636':'#0d3b66');ctx.fillText(l.t,x,y);});
}

function cityRadius(k){return [11,8.5,6,4][k];}
// Значки міст. Малюються у фазі значків — ДО підписів, інакше кружок
// накриває число картограми (Донецьк, Дніпро). Кожен кружок бронює своє місце.
function drawCitySymbols(){
  CITIES.cities.forEach(c=>{
    const x=px(c.xy[0]),y=py(c.xy[1]),r=cityRadius(c.k);
    if(x<-40||x>W+40||y<-40||y>H+40)return;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=c.c? 'rgba(214,40,70,0.82)':'rgba(238,146,58,0.82)';
    ctx.fill();
    ctx.strokeStyle=c.c? '#ffffff':'rgba(255,255,255,0.85)';
    ctx.lineWidth=c.c?2:1.2;ctx.stroke();
    if(c.c){ctx.beginPath();ctx.arc(x,y,Math.max(1.5,r*0.28),0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();}
    symbolBoxes.push([x-r-2,y-r-2,2*r+4,2*r+4]);
  });
}
// from..to — розмірні класи (0 — понад 1 млн … 3 — 100–250 тис.).
// Дані відсортовані за людністю, тож у межах порції більші отримують місце першими.
function drawCityLabels(from,to){
  const drawn=labelBoxes;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';

    if(c.k<from||c.k>to)return;

function drawCitiesLegend(measure){

// ===== Корисні копалини: паливні / рудні / нерудні =====
let labelBoxes=[], symbolBoxes=[];
// Підпис площинного об'єкта (число області): за можливості в центрі, інакше
// трохи вбік — значок міста на центрі області не має ховати число.
function placeAreaLabel(boxes,x,y,txt,color,halo){
  const w=ctx.measureText(txt).width, h=15;
  // центр області, далі кільцями навсібіч: у щільних областях (Донеччина —
  // місто, передмістя та їхні підписи поруч) число мусить мати куди відійти
  const cand=[[x,y]];
  [18,34,50].forEach(d=>{
    const dx=d+w/2-6;
    cand.push([x,y-d],[x,y+d],[x-dx,y],[x+dx,y],
              [x-dx*0.8,y-d*0.8],[x+dx*0.8,y-d*0.8],[x-dx*0.8,y+d*0.8],[x+dx*0.8,y+d*0.8]);
  });
  for(const c of cand){
    const box=[c[0]-w/2-3,c[1]-h/2,w+6,h];
    let hit=false;
    for(const b of boxes){if(box[0]<b[0]+b[2]&&box[0]+box[2]>b[0]&&box[1]<b[1]+b[3]&&box[1]+box[3]>b[1]){hit=true;break;}}
    if(hit)continue;
    boxes.push(box);
    ctx.lineWidth=3;ctx.strokeStyle=halo;ctx.strokeText(txt,c[0],c[1]);
    ctx.fillStyle=color;ctx.fillText(txt,c[0],c[1]);
    return true;
  }
  return false;
}
// Розміщення підпису біля значка: під → над → праворуч → ліворуч; перший вільний.
// boxes — спільний масив зайнятих прямокутників (labelBoxes), повертає true, якщо намальовано.
function placePointLabel(boxes,x,y,R,txt,color){
  const w=ctx.measureText(txt).width, dx=R+6+w/2, dy=R+10;   // діагоналі мають вийти за власний значок
  // вісім позицій: чотири прямі, далі діагоналі. Прямі читаються краще,
  // тому діагоналі — лише коли прямі зайняті.
  const cand=[[x,y+R+9],[x,y-R-9],[x+R+5+w/2,y],[x-R-5-w/2,y],
              [x+dx,y+dy],[x-dx,y+dy],[x+dx,y-dy],[x-dx,y-dy]];
  for(const c of cand){
    const box=[c[0]-w/2-2,c[1]-7,w+4,14];
    let hit=false;
    for(const b of boxes){if(box[0]<b[0]+b[2]&&box[0]+box[2]>b[0]&&box[1]<b[1]+b[3]&&box[1]+box[3]>b[1]){hit=true;break;}}
    if(hit)continue;
    boxes.push(box);
    ctx.strokeStyle='rgba(255,255,255,0.94)';ctx.lineWidth=3.5;ctx.strokeText(txt,c[0],c[1]);
    ctx.fillStyle=color;ctx.fillText(txt,c[0],c[1]);
    return true;
  }
  return false;
}

function dms(v,kind){

// ===== Атрибути карти: масштабна лінійка і стрілка півночі =====
// Проєкція рівнопроміжна з поправкою на косинус середньої широти, тому
// горизонтальний масштаб залежить від широти — рахуємо його для центру
// того, що зараз на екрані, а не для всієї країни.
function plate(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,0.88)';ctx.fill();
  ctx.strokeStyle='rgba(20,34,50,0.25)';ctx.lineWidth=1;ctx.stroke();
}
function centreLat(){
  const yNorm=1-((H/2-panY)/scale-mapOy)/mapH;
  return Math.max(LAT0,Math.min(LAT1,LAT0+yNorm*latRange));
}
function kmPerPx(){
  const pxPerDegLon=mapW*scale/(LON1-LON0);
  return 111.320*Math.cos(centreLat()*Math.PI/180)/pxPerDegLon;
}
function niceKm(maxPx){
  const kpp=kmPerPx(), steps=[1,2,5,10,20,25,50,100,200,250,500,1000,2000];
  let best=steps[0];
  steps.forEach(n=>{if(n/kpp<=maxPx)best=n;});
  return best;
}
function drawScaleBar(){
  const kpp=kmPerPx(), km=niceKm(Math.min(190,W*0.3)), w=km/kpp;
  if(!isFinite(w)||w<20)return;
  const x0=Math.round(W/2-w/2), y0=Math.round(H-30), h=7;
  ctx.save();
  plate(x0-12*fontScale,y0-9,w+24*fontScale,32*fontScale,6);
  for(let i=0;i<2;i++){ctx.fillStyle=i?'#ffffff':'#16232f';ctx.fillRect(x0+i*w/2,y0,w/2,h);}
  ctx.strokeStyle='#16232f';ctx.lineWidth=1;ctx.strokeRect(x0,y0,w,h);
  const fmt=v=>(v%1?v.toFixed(1).replace('.',','):String(v));
  ctx.font='10px system-ui';ctx.fillStyle='#16232f';ctx.textBaseline='top';
  ctx.textAlign='left';   ctx.fillText('0',x0,y0+9);
  ctx.textAlign='center'; ctx.fillText(fmt(km/2),x0+w/2,y0+9);
  ctx.textAlign='right';  ctx.fillText(fmt(km)+' км',x0+w,y0+9);
  ctx.restore();
}
function drawNorthArrow(){

  ctx.moveTo(x,y-21);ctx.lineTo(x+7,y+4);ctx.lineTo(x,y-1);ctx.lineTo(x-7,y+4);ctx.closePath();
  ctx.fillStyle='#16232f';ctx.fill();

function drawCentreSymbols(){

    if(labelBoxes.some(b=>rx<b[0]+b[2]&&rx+rw>b[0]&&ry<b[1]+b[3]&&ry+rh>b[1]))return;

function drawRivers(){
  // Річки малюються двічі: спершу світла підкладка (casing), потім насичена
  // синя лінія. Без підкладки середній синій губиться на зелених заливках
  // природних зон і ґрунтів — саме там, де річки потрібні найбільше.
  const w=Math.max(1.1,1.4*Math.min(scale,3));
  ctx.lineJoin='round';ctx.lineCap='round';
  const stroke=()=>RIVERS.features.forEach(f=>{
    f.geometry.coordinates.forEach(line=>{
      ctx.beginPath();
      line.forEach((p,j)=>{const x=px(p[0]),y=py(p[1]);j===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
      ctx.stroke();
    });
  });
  if(activeTheme()&&!blankMode){          // під заливкою — так; на чистій карті — ні
    ctx.strokeStyle='rgba(255,255,255,0.70)';
    ctx.lineWidth=w+1.8; stroke();
  }
  ctx.strokeStyle=blankMode?'#1565c0':'#3484c8';
  ctx.lineWidth=w; stroke();
}

      f.geometry.coordinates.forEach(l=>{if(l.length>maxLen){maxLen=l.length;longest=l;}});
      const mid=longest[Math.floor(longest.length/2)];

      if(x<0||x>W||y<0||y>H)return;
      const w=ctx.measureText(f.properties.uk).width, b0=[x-w/2-2,y-8,w+4,16];
      if(labelBoxes.some(b=>b0[0]<b[0]+b[2]&&b0[0]+b0[2]>b[0]&&b0[1]<b[1]+b[3]&&b0[1]+b0[3]>b[1]))return;
      labelBoxes.push(b0);
      ctx.strokeStyle='rgba(255,255,255,0.92)';ctx.lineWidth=3.5;ctx.strokeText(f.properties.uk,x,y);
      ctx.fillStyle='#0b3a5c';ctx.fillText(f.properties.uk,x,y);
    });
  }
}

// ГЕОМЕТРІЯ КУРСОРА: пошук області, підказка

function pointInRings(lon,lat,rings){
  let inside=false;
  for(const ring of rings){
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
      if(((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
    }
  }
  return inside;
}
function oblastAt(lon,lat){
  for(const f of UA.features){
    const g=f.geometry, polys=g.type==='MultiPolygon'?g.coordinates:[g.coordinates];
    for(const rings of polys){ if(pointInRings(lon,lat,rings)) return f.properties.uk; }
  }
  return null;
}
// ===== Повний екран, PNG, режим проєктора =====
// Розміри шрифтів на полотні розкидані по десятках функцій, тому масштабуємо їх
// в одній точці — перехоплюємо властивість ctx.font. measureText після цього
// теж рахує по збільшеному шрифту, отже перевірка накладання підписів не збивається.
let fontScale=1, bigMode=false;
function scaleFont(v){
  if(fontScale===1)return v;
  return String(v).replace(/([\d.]+)px/,(m,n)=>(parseFloat(n)*fontScale).toFixed(1)+'px');
}
(function hookFont(){
  const proto=Object.getPrototypeOf(ctx);
  const d=proto&&Object.getOwnPropertyDescriptor(proto,'font');
  if(d&&d.get&&d.set){
    Object.defineProperty(ctx,'font',{configurable:true,
      get(){return d.get.call(ctx);}, set(v){d.set.call(ctx,scaleFont(v));}});
  }else{
    let cur='10px system-ui';
    Object.defineProperty(ctx,'font',{configurable:true,
      get(){return cur;}, set(v){cur=scaleFont(v);}});
  }
})();
function setBig(v){

function fullscreenOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function toggleFullscreen(){
  const el=document.documentElement;

      const req=el.requestFullscreen||el.webkitRequestFullscreen;

// PNG: полотно як є (карта + значкові легенди + лінійка + стрілка), а зверху
// домальовуємо легенду активної теми — вона HTML-на й у полотно не потрапляє —
// і рядок джерел: картинка піде за межі застосунку, атрибуція має йти з нею.
function exportExtras(o){
  const id=activeTheme();
  if(id&&typeof THLEG!=='undefined'&&THLEG[id]){
    const lay=LAYERS.find(l=>l.id===id), rows=[], seen={};
    THLEG[id]().forEach(z=>{const k=z.name+'|'+z.fill;if(seen[k])return;seen[k]=1;rows.push(z);});
    const rh=19, bw=250, bh=26+rows.length*rh+6, bx=12, by=H-bh-40;
    o.fillStyle='rgba(255,255,255,0.93)';
    o.beginPath(); if(o.roundRect)o.roundRect(bx,by,bw,bh,8); else o.rect(bx,by,bw,bh);
    o.fill();
    o.textAlign='left';o.textBaseline='middle';
    o.fillStyle='#222';o.font='bold 12px system-ui';o.fillText(lay?lay.n:'',bx+10,by+15);
    rows.forEach((z,i)=>{const cy=by+32+i*rh;
      o.fillStyle=z.fill;o.fillRect(bx+10,cy-6,18,12);
      o.strokeStyle='rgba(0,0,0,0.3)';o.lineWidth=0.6;o.strokeRect(bx+10,cy-6,18,12);
      o.fillStyle='#222';o.font='11.5px system-ui';o.fillText(z.name,bx+34,cy);
      if(z.pct){o.textAlign='right';o.fillStyle='#666';o.fillText(z.pct,bx+bw-10,cy);o.textAlign='left';}
    });
  }
  const src='Рельєф — SRTM (NASA) · річки, межі — Natural Earth, © OpenStreetMap (ODbL) · статистика — Держстат';
  o.font='11px system-ui';o.textAlign='left';o.textBaseline='alphabetic';

  o.beginPath(); if(o.roundRect)o.roundRect(12,H-30,w,20,5); else o.rect(12,H-30,w,20);
  o.fill();
  o.fillStyle='#33424f';o.fillText(src,20,H-16);
}
function exportPNG(){
  const dpr=devicePixelRatio||1;
  const out=document.createElement('canvas');
  out.width=cv.width; out.height=cv.height;
  const o=out.getContext('2d');
  o.fillStyle='#0d1b2e';o.fillRect(0,0,out.width,out.height);
  o.drawImage(cv,0,0);
  o.setTransform(dpr,0,0,dpr,0,0);
  exportExtras(o);
  const name='atlas-ukrainy-'+new Date().toISOString().slice(0,10)+'.png';
  try{
    const a=document.createElement('a');
    a.download=name; a.href=out.toDataURL('image/png');
    document.body.appendChild(a); a.click(); a.remove();
  }catch(err){}
  return name;
}
// ===== Накопичувальний рядок під картою =====
// Теми на карті взаємовиключні, але дані всіх шарів лежать у файлі — тому в точці
// під курсором показуємо ланцюжок «зона → ґрунт → структура» цілком, навіть якщо

let statusPinned=false, statusOn=true, tipOn=true, barOn=true;
// Уся нижня смуга ховається одним рухом — коли потрібен максимум карти.
function setBarOn(v){

// Плашка біля курсора дублює рядок унизу, тож вимикається окремо: рядок лишається.

// Режим опитування: підказки під курсором (рядок і спливаюча висота) вимикаються,
// карта лишається. Учень відповідає — і аж тоді вмикаємо, щоб перевірити.
function setStatusOn(v){
  statusOn=v;
  const b=document.getElementById('statusBtn'), t=document.getElementById('statusText');
  if(b){b.textContent=v?'сховати підказки':'підказки вимкнено · показати';b.classList.toggle('off',!v);}
  if(!v){statusPinned=false;
    const el=document.getElementById('status'); if(el)el.classList.remove('pin');
    if(t)t.innerHTML='';
    if(typeof tip!=='undefined')tip.style.display='none';
  }else if(t){clearStatus();}
  const p=document.getElementById('btnStatusPanel');
  if(p)p.textContent=v?'Сховати підказки (H)':'Показати підказки (H)';
}
function statusHTML(lon,lat){
  const th=activeTheme();
  const nm=oblastAt(lon,lat);
  const co='<span class="co">'+dms(lat,'lat')+' · '+dms(lon,'lon')+'</span>';
  if(!nm) return '<span class="k">поза межами України</span><span class="sep">·</span>'+co;
  let mid='';
  if(th==='tgDensity'){const r=DENSITY.regions[nm];if(r)mid='<span class="sep">·</span><span class="k">густота:</span> <span class="on">'+r.d+' ос/км²</span>';}
  if(th==='tgUrban'){const r=URBAN.regions[nm];if(r)mid='<span class="sep">·</span><span class="k">міське:</span> <span class="on">'+r.u.toFixed(1).replace('.',',')+' %</span>';}
  if(th==='tgGDP'){const r=GDP.regions[nm];if(r)mid='<span class="sep">·</span><span class="k">ВРП/особу:</span> <span class="on">'+r.d+' €</span>';}
  return '<b>'+nm.replace(' область',' обл.')+'</b>'+mid+'<span class="sep">·</span>'+co;
}

function renderStatus(lon,lat){
  if(statusPinned||!statusOn)return;
  const el=document.getElementById('statusText'); if(!el)return;
  el.innerHTML=statusHTML(lon,lat);
}
function clearStatus(){
  if(statusPinned)return;
  const el=document.getElementById('statusText'); if(!el)return;
  el.innerHTML=statusOn?'<span class="hint">Наведіть курсор на карту · клік — зафіксувати значення</span>':'';
}
function togglePin(lon,lat){
  if(!statusOn)return;
  const el=document.getElementById('status'), t=document.getElementById('statusText'); if(!el||!t)return;
  statusPinned=!statusPinned;
  el.classList.toggle('pin',statusPinned);
  if(statusPinned){t.innerHTML=statusHTML(lon,lat)+'<span class="sep">·</span><span class="hint">зафіксовано, клік — зняти</span>';}
  else{renderStatus(lon,lat);}
}
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(drag){panX+=e.clientX-ds.x;panY+=e.clientY-ds.y;ds={x:e.clientX,y:e.clientY};draw();return;}
  const lon=LON0+((mx-panX)/scale-mapOx)/mapW*(LON1-LON0);
  const yNorm=1-((my-panY)/scale-mapOy)/mapH;
  const lat=LAT0+yNorm*latRange;
  renderStatus(lon,lat);
  let content=null;
  if(!statusOn||!tipOn)content=null;
  if(content!==null){
    tip.innerHTML=content;
    tip.style.display='block';
    const wr=cv.parentElement.getBoundingClientRect();
    let tx=e.clientX-wr.left+15,ty=e.clientY-wr.top-10;if(tx+185>W)tx-=195;
    tip.style.left=tx+'px';tip.style.top=ty+'px';cv.style.cursor='crosshair';
  }else{tip.style.display='none';cv.style.cursor=drag?'grabbing':'grab';}
});

// Нижня смуга може змінити висоту (перенос чіпів, розгортання нотатки, повний
// екран) — подія resize вікна при цьому не виникає, тож полотно лишалося
// розтягнутим. Стежимо за самим контейнером.
(function watchBox(){
  if(typeof ResizeObserver==='undefined')return;
  let lw=0,lh=0,pending=false;
  new ResizeObserver(()=>{
    const r=cv.parentElement.getBoundingClientRect();
    if(Math.abs(r.width-lw)<0.5&&Math.abs(r.height-lh)<0.5)return;
    lw=r.width;lh=r.height;
    if(pending)return; pending=true;
    requestAnimationFrame(()=>{pending=false;resize();});
  }).observe(cv.parentElement);
})();

  {n:'Рудні корисні копалини',   t:null, o:['tgOre','tgBorders','tgRivers']},
  {n:'Нерудні корисні копалини', t:null, o:['tgNon','tgBorders','tgRivers']},
  {n:'Зони с/г спеціалізації', t:null, o:['tgAgroZones','tgSuburban','tgBorders']},
  {n:'Лісистість областей', t:null, o:['tgForest','tgBorders']},
  {n:'Наука та ІТ', t:null, o:['tgIT','tgBorders']},
  {n:'Туризм', t:null, o:['tgTourism','tgBorders']},
  {n:'Електроенергетика',t:null, o:['tgPower','tgBorders','tgRivers']},
  {n:'Транспорт',       t:null, o:['tgTransport','tgBorders','tgRivers']},
  {n:'Металургія',      t:null, o:['tgMetal','tgBorders','tgRivers']},
  {n:'Машинобудування', t:null, o:['tgMach','tgBorders','tgRivers']},
  {n:'Хімія',           t:null, o:['tgChem','tgBorders','tgRivers']},
  {n:'Харчова',         t:null, o:['tgFood','tgBorders','tgRivers']},
  {n:'Легка',           t:null, o:['tgLight','tgBorders','tgRivers']},
  {n:'Населення',       t:'tgDensity', o:['tgCities','tgBorders','tgRivers']},
  {n:'Контурна карта',  t:null, o:['tgBlank','tgBorders','tgRivers']}
];

const THEMES=LAYERS.filter(l=>l.k==='t');
// var, а не const: draw() викликає activeTheme() ще до виконання цього блоку
var THEME_IDS=['tgDensity','tgUrban','tgForest','tgGDP','tgAgroZones','tgSuburban'];
const THLEG={
  tgDensity:()=>DENSITY.legend.map(l=>({name:l.t,fill:l.c})),
  tgUrban:()=>URBAN.legend.map(l=>({name:l.t,fill:l.c})),
  tgForest:()=>FOREST.legend.map(l=>({name:l.t,fill:l.c})),
  tgGDP:()=>GDP.legend.map(l=>({name:l.t,fill:l.c})).concat([{name:'Київ 8410 €',fill:'#08306b'},{name:'Крим — даних немає',fill:'#e8e8e8'}]),
  tgAgroZones:()=>{
    const rows=AGZONES.zones.map(z=>({name:z.name,fill:z.fill}));
    if(isOn('tgSuburban')) rows.push({name:'Приміське господарство (навколо великих міст)',fill:'rgba(120,170,60,0.55)'});
    return rows;
  },
  tgSuburban:()=>[{name:'Приміське господарство (навколо великих міст)',fill:'rgba(120,170,60,0.55)'}]
};

let noteId='none';
function box(id){return document.getElementById(id);}
function isOn(id){const b=box(id);return !!(b&&b.checked);}
function activeTheme(){
  if(!THEME_IDS)return null;
  for(let i=0;i<THEME_IDS.length;i++){if(isOn(THEME_IDS[i]))return THEME_IDS[i];}
  return null;
}
function setLayer(id,on){
  const b=box(id); if(!b||b.checked===on)return false;
  b.checked=on; b.dispatchEvent(new Event('change')); return true;
}
function pickTheme(id){
  THEMES.forEach(l=>{if(l.id!==id)setLayer(l.id,false);});
  if(id)setLayer(id,true);
  if(id)noteId=id; else if(THEMES.some(l=>l.id===noteId))noteId='none';
  syncUI();
}
function applyPreset(p){
  THEMES.forEach(l=>setLayer(l.id,l.id===p.t));
  LAYERS.filter(l=>l.k==='o').forEach(l=>setLayer(l.id,p.o.indexOf(l.id)>=0));
  noteId='#'+p.n;
  syncUI();
}

// --- панель ---
(function buildPanel(){
  const p=box('panel');
  let h='<h3>Тематична заливка</h3><div class="hint">одна за раз · клавіші 1–9, 0 — зняти</div>';
  h+='<label><input type="radio" name="theme" value=""> немає<span class="key">0</span></label>';
  THEMES.forEach((l,i)=>{
    h+='<label><input type="radio" name="theme" value="'+l.id+'"> '+l.n+
       (i<9?'<span class="key">'+(i+1)+'</span>':'')+'</label>';
  });
  h+='<h3>Накладки</h3><div class="hint">скільки завгодно разом</div>';
  OGROUPS.forEach(g=>{
    h+='<div class="grp">'+g+'</div>';
    LAYERS.filter(l=>l.k==='o'&&l.g===g).forEach(l=>{
      h+='<label><input type="checkbox" data-l="'+l.id+'"> '+l.n+'</label>';
    });
  });
  h+='<div class="pfoot"><button id="btnBarPanel">Нижня смуга: показано (B)</button>'+
       '<button id="btnTipPanel">Плашка біля курсора: увімк. (T)</button>'+
       '<button id="btnStatusPanel">Сховати підказки (H)</button>'+
       '<button id="btnClear">Зняти все</button>'+
       '<div class="keys">F — екран · P — шрифт · H — підказки · T — плашка · B — смуга · L — панель</div></div>';
  p.innerHTML=h;
  p.querySelectorAll('input[name=theme]').forEach(r=>{r.onchange=()=>pickTheme(r.value||null);});
  p.querySelectorAll('input[data-l]').forEach(c=>{
    c.onchange=()=>{const id=c.dataset.l;setLayer(id,c.checked);if(c.checked)noteId=id;syncUI();};
  });
  box('btnTipPanel').onclick=()=>setTipOn(!tipOn);
  box('btnBarPanel').onclick=()=>setBarOn(!barOn);
  box('btnStatusPanel').onclick=()=>setStatusOn(!statusOn);
  box('btnClear').onclick=()=>{
    LAYERS.forEach(l=>setLayer(l.id,false));noteId='none';syncUI();
  };
})();

// --- пресети ---
(function buildPresets(){
  const w=box('presets');
  PRESETS.forEach(p=>{
    const b=document.createElement('button');
    b.textContent=p.n; b.onclick=()=>applyPreset(p);
    w.appendChild(b);
  });
})();

box('btnLayers').onclick=()=>{box('panel').classList.toggle('open');};
box('statusBtn').onclick=()=>setStatusOn(!statusOn);
box('barBtn').onclick=()=>setBarOn(!barOn);
box('btnFull').onclick=toggleFullscreen;
box('btnPng').onclick=exportPNG;
box('btnBig').onclick=()=>setBig(!bigMode);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type==='text')return;
  if(e.key==='Escape')box('panel').classList.remove('open');
  if(e.key==='l'||e.key==='L'||e.key==='ш'||e.key==='Ш')box('panel').classList.toggle('open');
  if(e.key==='h'||e.key==='H'||e.key==='р'||e.key==='Р')setStatusOn(!statusOn);
  if(e.key==='t'||e.key==='T'||e.key==='е'||e.key==='Е')setTipOn(!tipOn);
  if(e.key==='b'||e.key==='B'||e.key==='и'||e.key==='И')setBarOn(!barOn);
  if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А')toggleFullscreen();
  if(e.key==='p'||e.key==='P'||e.key==='з'||e.key==='З')setBig(!bigMode);
  if(e.key>='0'&&e.key<='9'){
    const i=+e.key;
    pickTheme(i===0?null:(THEMES[i-1]?THEMES[i-1].id:null));
  }
});

// --- зведена легенда теми ---
function renderThemeLegend(){
  const el=box('thleg'), id=activeTheme();
  if(!id||!THLEG[id]){el.style.display='none';return;}
  const lay=LAYERS.find(l=>l.id===id), seen={};
  let h='<h4>'+lay.n+'</h4>';
  THLEG[id]().forEach(z=>{
    const key=z.name+'|'+z.fill; if(seen[key])return; seen[key]=1;
    h+='<div class="row"><span class="sw" style="background:'+z.fill+'"></span>'+
       '<span>'+z.name+'</span>'+(z.pct?'<span class="pc">'+z.pct+'</span>':'')+'</div>';
  });
  el.innerHTML=h; el.style.display='block';
}

// --- чіпи активних шарів ---
function renderChips(){
  const w=box('chips'); w.innerHTML='';
  const on=LAYERS.filter(l=>isOn(l.id));
  if(!on.length){w.innerHTML='<span class="empty">Показано лише рельєф</span>';return;}
  on.forEach(l=>{
    const c=document.createElement('span');
    c.className='chip'+(l.k==='t'?' theme':'');
    c.innerHTML='<span>'+l.n+'</span><span class="x">×</span>';
    c.title='Клацніть, щоб прочитати пояснення';
    c.querySelector('.x').onclick=ev=>{ev.stopPropagation();setLayer(l.id,false);if(noteId===l.id)noteId='none';syncUI();};
    c.onclick=()=>{noteId=l.id;syncUI();};
    w.appendChild(c);
  });
}

// --- пояснення до шару ---
function renderNote(){
  const el=box('note');
  const preset=noteId.charAt(0)==='#'?PRESET_NOTES[noteId.slice(1)]:null;
  const n=preset||NOTES[noteId]||NOTES.none;
  const lay=LAYERS.find(l=>l.id===noteId);
  const title=preset?noteId.slice(1):(lay?lay.n:'Гіпсометрія');
  const col=el.classList.contains('collapsed');
  // згорнута — один рядок поруч із чіпами, зайве відсікає ellipsis
  let h='<div class="line"><span class="tgl">'+(col?'довідка ▾':'згорнути ▴')+'</span><b>'+title+'</b> — '+n.d+'</div>';
  h+='<div class="more">';
  if(n.a)h+='<div class="acc">'+n.a+'</div>';
  h+='<div class="src">Джерело: '+n.s+'</div>';
  if(n.w)h+='<div class="warn">'+n.w+'</div>';
  h+='<div class="src attrib">Рельєф — SRTM (NASA) · річки, озера, межі — Natural Earth та OpenStreetMap (© учасники OpenStreetMap, ODbL) · статистика — Держстат</div>';
  h+='</div>';
  el.innerHTML=h;
  el.querySelector('.line').onclick=()=>{el.classList.toggle('collapsed');renderNote();resize();};
}

function syncUI(){
  const th=activeTheme();
  document.querySelectorAll('#panel input[name=theme]').forEach(r=>{r.checked=(r.value===(th||''));});
  document.querySelectorAll('#panel input[data-l]').forEach(c=>{c.checked=isOn(c.dataset.l);});
  renderThemeLegend(); renderChips(); renderNote();
}
syncUI();
setStatusOn(true);
setTipOn(true);
setBarOn(true);
</script>
</body></html>
